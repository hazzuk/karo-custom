---

hazzuk_extra_dozzle_enabled: false

hazzuk_extra_dozzle_stack_defaults:
  dozzle:
    image: docker.io/amir20/dozzle # -8<- [end:x]
    version: v11.1.0-alpine@sha256:9422c83f1ad06e65a335e8d430e796dd940a338f083d46d4c03f1de4a20aa060 # -8<- [end:x]
