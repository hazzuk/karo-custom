# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

# Commands:
# - `prek install`  Install prek Git hook shims
# - `prek -a`       Run hooks on all tracked files

exclude = { glob = ["LICENSE", "LICENSES/*"] }

default_stages = ["pre-commit"]
default_install_hook_types = [
  "pre-commit",
  "commit-msg",
]

[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace" },
  { id = "check-added-large-files" },
  { id = "end-of-file-fixer" },
  { id = "check-json5" },
  { id = "check-toml" },
  { id = "check-yaml" },
  { id = "mixed-line-ending", args = ["--fix=lf"] },
]

[[repos]]
repo = "https://github.com/editorconfig-checker/editorconfig-checker"
rev = "v3.11.1"
hooks = [
  {
    id = "editorconfig-checker",
    name = "editorconfig: lint files",
  }
]

[[repos]]
repo = "https://codeberg.org/fsfe/reuse-tool"
rev = "v6.2.0"
hooks = [
  {
    id = "reuse-lint-file",
    name = "reuse: lint files",
  }
]

[[repos]]
repo = "https://github.com/crate-ci/typos"
rev = "v1.49.0"
hooks = [
  {
    id = "typos",
    name = "typos: lint files",
  },
  {
    id = "typos",
    name = "typos: lint commit message",
    args = ["--force-exclude"],
    stages = ["commit-msg"],
  }
]
